# The API only. In production the database and media bucket are hosted by Utho.
name: cicc-api
services:
  api:
    build: .
    image: cicc-api
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
    # Localhost only: nginx is the public entrance.
    ports: ["127.0.0.1:${API_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
